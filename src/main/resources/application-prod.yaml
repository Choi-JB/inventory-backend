# application-prod.yaml — 임시 운영 프로필 (gitignore, 배포 jar 에 포함되지 않음)
# 프론트 https://inventory-frontend-ten-eta.vercel.app 와 API 호스트가 다른 사이트일 때 사용.
# access/refresh 쿠키는 SameSite=None + Secure=true 여야 Vercel 페이지의 fetch 에 실림.
# 로컬 HTTP(profile=local)에서는 None 을 쓸 수 없다.
# 비밀값은 이 파일에 두지 말고 환경변수로 주입:
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_DATASOURCE_URL / USERNAME / PASSWORD
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
#   SPRING_AI_GOOGLE_GENAI_API_KEY
#   SPRING_AI_GOOGLE_GENAI_EMBEDDING_API_KEY
#   JWT_SECRET
#   FRONTEND_URL=https://inventory-frontend-ten-eta.vercel.app
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            scope:
              - email
              - profile

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

frontend:
  url: https://inventory-frontend-ten-eta.vercel.app

app:
  cookie:
    secure: true
    same-site: None

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
