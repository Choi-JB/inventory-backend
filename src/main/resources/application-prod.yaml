# application-prod.yaml — 운영 프로필 (gitignore)
# 비밀값은 이 파일에 두지 말고 호스팅 환경변수로 주입:
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_DATASOURCE_URL / USERNAME / PASSWORD
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
#   SPRING_AI_GOOGLE_GENAI_API_KEY
#   JWT_SECRET  (또는 jwt.secret)
#   FRONTEND_URL (또는 frontend.url)  — 예: https://your-frontend.example.com
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            scope:
              - email
              - profile

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
