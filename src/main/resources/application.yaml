# application.yaml — 공통(비비밀) 설정
# 로컬: profiles.active=local (기본)
# 배포: SPRING_PROFILES_ACTIVE=prod 로 덮어쓰기
spring:
  application:
    name: inventory-api
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  ai:
    google:
      genai:
        chat:
          model: models/gemini-3.1-flash-lite
          thinking-level: LOW
        embedding:
          text:
            model: gemini-embedding-001
            dimensions: 768
    vectorstore:
      pgvector:
        table-name: manual_embeddings
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false

# 배포 시 FRONTEND_URL 또는 frontend.url 환경변수로 덮어쓰기
frontend:
  url: http://localhost:3000

# 비밀이 아닌 JWT 만료시간 (secret 은 프로필/환경변수)
jwt:
  expiration: 1800000          # 30분(ms)
  refreshExpirationMs: 32400000  # 9시간(ms)

# Gemini 호출 설정 (config/ChatConfig에서 사용)
chat:
  gemini:
    timeout-ms: 20000     # 호출 1번당 최대 대기 시간. 넘으면 포기하고 503(CHAT_UNAVAILABLE)
    retry-attempts: 1     # Google SDK 자동 재시도 횟수. 1 = 재시도 없음 (기본값은 5번, 약 30초)
  manual:
    similarity-threshold: 0.69  # 매뉴얼 검색 유사도 하한. 측정값: 있는 질문 0.72~0.76, 없는 질문 0.62~0.66

# 로컬 개발용. 운영(prod)에서는 application-prod.yaml 에서 false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
