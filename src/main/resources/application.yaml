# application.yaml
spring:
  application:
    name: inventory
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  ai:
    google:
      genai:
        chat:
          model: models/gemini-3.1-flash-lite
          thinking-level: LOW
        embedding:
          text:
            model: gemini-embedding-001
            dimensions: 768
    vectorstore:
        pgvector:
          table-name: manual_embeddings
          dimensions: 768
          distance-type: COSINE_DISTANCE
          index-type: HNSW
          initialize-schema: false

frontend:
  url: http://localhost:3000

# Gemini 호출 설정 (config/ChatConfig에서 사용)
chat:
  gemini:
    timeout-ms: 20000     # 호출 1번당 최대 대기 시간. 넘으면 포기하고 503(CHAT_UNAVAILABLE)
    retry-attempts: 1     # Google SDK 자동 재시도 횟수. 1 = 재시도 없음 (기본값은 5번, 약 30초)
  manual:
    similarity-threshold: 0.69  # 매뉴얼 검색 유사도 하한. 측정값: 있는 질문 0.72~0.76, 없는 질문 0.62~0.66