# 통합 테스트 전용. 로컬 비밀값(application-local.yaml)은 읽지 않는다.
# Docker 가 없는 환경에서도 HTTP-보안-JPA 경로를 보기 위해 H2(PostgreSQL 호환 모드)를 쓴다.
spring:
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret
  ai:
    google:
      genai:
        api-key: test-key
        embedding:
          api-key: test-key

jwt:
  secret: 0123456789abcdef0123456789abcdef

frontend:
  url: http://localhost:3000

app:
  cookie:
    secure: false
    same-site: Lax
