# 동시 출고 테스트 전용. H2 통합 테스트(application-test.yaml)와 분리한다.
# 로컬 PostgreSQL의 inventory_test 만 사용한다. 비밀번호는 PG_TEST_PASSWORD.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_test
    username: postgres
    password: ${PG_TEST_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret
  ai:
    google:
      genai:
        api-key: test-key
        embedding:
          api-key: test-key

jwt:
  secret: 0123456789abcdef0123456789abcdef

frontend:
  url: http://localhost:3000

app:
  cookie:
    secure: false
    same-site: Lax
